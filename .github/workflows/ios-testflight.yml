name: iOS TestFlight (private source, no EAS)

# Builds a SIGNED iOS app on GitHub's macOS runner (free for public repos) and uploads it straight to App Store Connect /
# TestFlight, without EAS (so the Expo build quota is not used). The private app repo is checked out on the runner with a
# read-only token; nothing from it is stored here, and the .ipa is NOT uploaded as an artifact.
#
# Signing: Xcode's automatic signing with the App Store Connect API key (-allowProvisioningUpdates), so no .p12 or
# provisioning profile has to be exported. Secrets of THIS repo:
#   SOURCE_REPO_TOKEN   fine-grained token, Contents: Read on the private app repo only
#   ASC_API_KEY_P8      content of the App Store Connect API key (.p8); the key needs the App Manager or Admin role
#   ASC_API_KEY_ID      its Key ID
#   ASC_API_ISSUER_ID   the Issuer ID
#   APPLE_TEAM_ID       Apple Developer Team ID
# Manual runs only: no push / pull_request triggers, so forks can never reach the secrets.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit of the source repo"
        required: false
        default: "main"
      build_number_base:
        description: "Build number = this base + the run number of this workflow (must stay above every build already in App Store Connect)"
        required: false
        default: "1000"

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  SOURCE_REPO: mehmetakifsari/claims-vision-ios-app-2

jobs:
  build-and-upload:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout the private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ github.event.inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      - name: Check required secrets
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in ASC_API_KEY_P8 ASC_API_KEY_ID ASC_API_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing secret $name"; missing=1; fi
          done
          exit $missing

      - name: Verify the App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          # Calls the App Store Connect API with the key and prints ONLY status codes and counts (the repo is public, so no
          # names or ids go to the log). 200 = the key, Key ID and Issuer ID belong together; 401 = they do not.
          cat > "$RUNNER_TEMP/asc-verify.mjs" <<'JS'
          import crypto from "node:crypto";
          const pem = process.env.ASC_API_KEY_P8, kid = process.env.ASC_API_KEY_ID.trim(), iss = process.env.ASC_API_ISSUER_ID.trim();
          const b64 = (v) => Buffer.from(typeof v === "string" ? v : JSON.stringify(v)).toString("base64url");
          let key;
          try { key = crypto.createPrivateKey(pem); } catch { console.error("::error::ASC_API_KEY_P8 is not a valid private key (paste the whole .p8 content, BEGIN and END lines included; it must be the key from App Store Connect > Integrations > Keys, not an APNs key)"); process.exit(1); }
          // Format checks only (no values are printed): a wrong paste shows up here before Apple answers 401.
          const raw = { kid: process.env.ASC_API_KEY_ID, iss: process.env.ASC_API_ISSUER_ID };
          console.log(`Key ID: length ${kid.length}, 10 letters/digits: ${/^[A-Z0-9]{10}$/.test(kid)}, had surrounding whitespace: ${raw.kid !== kid}`);
          console.log(`Issuer ID: length ${iss.length}, UUID format: ${/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(iss)}, had surrounding whitespace: ${raw.iss !== iss}`);
          console.log(`Key: type ${key.asymmetricKeyType}, curve ${key.asymmetricKeyDetails?.namedCurve} (App Store Connect keys are ec / prime256v1)`);
          console.log(`Key text: ${pem.split("\n").filter(Boolean).length} lines, starts with BEGIN PRIVATE KEY: ${pem.trimStart().startsWith("-----BEGIN PRIVATE KEY-----")}`);
          const now = Math.floor(Date.now() / 1000);
          const head = b64({ alg: "ES256", kid, typ: "JWT" }), body = b64({ iss, iat: now, exp: now + 600, aud: "appstoreconnect-v1" });
          const jwt = `${head}.${body}.${crypto.sign("sha256", Buffer.from(`${head}.${body}`), { key, dsaEncoding: "ieee-p1363" }).toString("base64url")}`;
          const get = async (path) => { const r = await fetch(`https://api.appstoreconnect.apple.com${path}`, { headers: { Authorization: `Bearer ${jwt}` } }); return { status: r.status, json: await r.json().catch(() => ({})) }; };
          const apps = await get("/v1/apps?limit=1");
          console.log(`API check (/v1/apps): HTTP ${apps.status}`);
          if (apps.status === 401) { console.error("::error::401 from App Store Connect: the Key ID, Issuer ID and .p8 do not belong together (or the key was created under Individual Keys, which has no Issuer ID: it must be a TEAM key). Re-enter ASC_API_KEY_ID, ASC_API_ISSUER_ID and ASC_API_KEY_P8 from the SAME key (App Store Connect > Users and Access > Integrations > Keys; the file is AuthKey_<KeyID>.p8)."); process.exit(1); }
          if (apps.status !== 200) { console.error(`::error::Unexpected HTTP ${apps.status}`); process.exit(1); }
          const certs = await get("/v1/certificates?limit=200");
          const types = {}; for (const c of certs.json.data ?? []) types[c.attributes.certificateType] = (types[c.attributes.certificateType] ?? 0) + 1;
          console.log(`Certificates: HTTP ${certs.status}`, JSON.stringify(types));
          const devices = await get("/v1/devices?limit=200");
          console.log(`Registered devices: HTTP ${devices.status}, count ${(devices.json.data ?? []).length}`);
          const profiles = await get("/v1/profiles?limit=200");
          const kinds = {}; for (const c of profiles.json.data ?? []) kinds[c.attributes.profileType] = (kinds[c.attributes.profileType] ?? 0) + 1;
          console.log(`Profiles: HTTP ${profiles.status}`, JSON.stringify(kinds));
          JS
          node "$RUNNER_TEMP/asc-verify.mjs"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild iOS native project
        run: npx expo prebuild --platform ios

      - name: Set the build number
        env:
          BASE: ${{ github.event.inputs.build_number_base }}
        run: |
          set -euo pipefail
          BUILD=$((BASE + GITHUB_RUN_NUMBER))
          PLIST=$(find ios -maxdepth 2 -name Info.plist -not -path "*/Pods/*" | head -n1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST"
          echo "Build number $BUILD, version $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"

      - name: Archive (signed, automatic signing with the API key)
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s\n' "$ASC_API_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag{print $1; exit}')
          echo "Workspace: $WORKSPACE, scheme: $SCHEME"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Export and upload to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"
          {
            echo "### TestFlight"
            echo ""
            echo "The build was uploaded to App Store Connect. It shows up in TestFlight after Apple has processed it (usually 10-30 minutes)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
