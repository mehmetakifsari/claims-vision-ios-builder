name: iOS TestFlight (private source, no EAS)

# Builds a SIGNED iOS app on GitHub's macOS runner (free for public repos) and uploads it straight to App Store Connect /
# TestFlight, without EAS (so the Expo build quota is not used). The private app repo is checked out on the runner with a
# read-only token; nothing from it is stored here, and the .ipa is NOT uploaded as an artifact.
#
# Signing: Xcode's automatic signing with the App Store Connect API key (-allowProvisioningUpdates), so no .p12 or
# provisioning profile has to be exported. Secrets of THIS repo:
#   SOURCE_REPO_TOKEN   fine-grained token, Contents: Read on the private app repo only
#   ASC_API_KEY_P8      content of the App Store Connect API key (.p8); the key needs the App Manager or Admin role
#   ASC_API_KEY_ID      its Key ID
#   ASC_API_ISSUER_ID   the Issuer ID
#   APPLE_TEAM_ID       Apple Developer Team ID
# Manual runs only: no push / pull_request triggers, so forks can never reach the secrets.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit of the source repo"
        required: false
        default: "main"
      build_number_base:
        description: "Build number = this base + the run number of this workflow (must stay above every build already in App Store Connect)"
        required: false
        default: "1000"

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  SOURCE_REPO: mehmetakifsari/claims-vision-ios-app-2

jobs:
  build-and-upload:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout the private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ github.event.inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      - name: Check required secrets
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in ASC_API_KEY_P8 ASC_API_KEY_ID ASC_API_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing secret $name"; missing=1; fi
          done
          exit $missing

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild iOS native project
        run: npx expo prebuild --platform ios

      - name: Set the build number
        env:
          BASE: ${{ github.event.inputs.build_number_base }}
        run: |
          set -euo pipefail
          BUILD=$((BASE + GITHUB_RUN_NUMBER))
          PLIST=$(find ios -maxdepth 2 -name Info.plist -not -path "*/Pods/*" | head -n1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST"
          echo "Build number $BUILD, version $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"

      - name: Archive (signed, automatic signing with the API key)
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s\n' "$ASC_API_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag{print $1; exit}')
          echo "Workspace: $WORKSPACE, scheme: $SCHEME"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Export and upload to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"
          {
            echo "### TestFlight"
            echo ""
            echo "The build was uploaded to App Store Connect. It shows up in TestFlight after Apple has processed it (usually 10-30 minutes)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
